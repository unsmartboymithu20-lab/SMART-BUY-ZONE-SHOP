services:
  - type: web
    name: smart-buy-zone
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    disk:
      name: smart-buy-zone-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/store.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
